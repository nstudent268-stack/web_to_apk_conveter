name: Build Web2APK & HTML2APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'url or html'
        required: true
        default: 'url'
      app_name:
        description: 'App Name'
        required: true
      web_url:
        description: 'Website URL'
        required: false
        default: 'file:///android_asset/index.html'
      html_file_id:
        description: 'Telegram HTML Document file_id or none'
        required: false
        default: 'none'
      html_code:
        description: 'Raw HTML Code or none'
        required: false
        default: 'none'
      package_name:
        description: 'Android Package Name'
        required: true
      app_version:
        description: 'App Version Name'
        required: false
        default: '1.0'
      icon_file_id:
        description: 'Telegram File ID, pwa, or default'
        required: true
        default: 'default'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      progress_msg_id:
        description: 'Pinned Progress Message ID'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update Progress 25%
        if: ${{ inputs.progress_msg_id != '' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MSG_ID: ${{ inputs.progress_msg_id }}
        run: |
          MSG_TXT="⏳ <b>APK তৈরি হচ্ছে... 25%</b>%0A<code>[███░░░░░░░]</code>%0A%0A⚙️ <i>সার্ভার ও Java এনভায়রনমেন্ট প্রস্তুত হচ্ছে...</i>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}" -d "parse_mode=HTML" -d "text=${MSG_TXT}" >/dev/null || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7 with Fast Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Install Pillow & Requests
        run: python3 -c "import PIL, requests" 2>/dev/null || pip install --quiet pillow requests

      - name: Generate Android Project
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          APP_NAME: ${{ inputs.app_name }}
          WEB_URL: ${{ inputs.web_url }}
          HTML_FILE_ID: ${{ inputs.html_file_id }}
          HTML_CODE: ${{ inputs.html_code }}
          PKG_NAME: ${{ inputs.package_name }}
          APP_VER: ${{ inputs.app_version }}
          ICON_ID: ${{ inputs.icon_file_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          MSG_ID: ${{ inputs.progress_msg_id }}
          GH_REPO: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, re, json, requests
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from xml.sax.saxutils import escape
          from PIL import Image, ImageDraw
          from io import BytesIO

          build_mode = os.environ["BUILD_MODE"].strip()
          app_name = os.environ["APP_NAME"].strip()
          web_url = os.environ["WEB_URL"].strip()
          html_file_id = os.environ["HTML_FILE_ID"].strip()
          html_code = os.environ["HTML_CODE"]
          pkg_name = os.environ["PKG_NAME"].strip().lower()
          app_ver = re.sub(r'[^0-9.]', '', os.environ.get("APP_VER", "1.0").strip()) or "1.0"
          icon_id = os.environ["ICON_ID"].strip()
          chat_id = os.environ["CHAT_ID"].strip()
          msg_id = os.environ["MSG_ID"].strip()
          gh_repo = os.environ["GH_REPO"].strip()
          bot_token = os.environ["BOT_TOKEN"].strip()

          pkg_path = pkg_name.replace(".", "/")
          os.makedirs(f"app/src/main/java/{pkg_path}", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/drawable-xxxhdpi", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          for d in ["mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"]:
              os.makedirs(f"app/src/main/res/mipmap-{d}", exist_ok=True)

          target_load_url = web_url
          target_domain = ""
          if build_mode == "html":
              target_load_url = "file:///android_asset/index.html"
              html_saved = False
              if html_file_id and html_file_id != "none":
                  try:
                      r = requests.get(f"https://api.telegram.org/bot{bot_token}/getFile?file_id={html_file_id}", timeout=15).json()
                      if r.get("ok"):
                          fpath = r["result"]["file_path"]
                          hdata = requests.get(f"https://api.telegram.org/file/bot{bot_token}/{fpath}", timeout=20).content
                          with open("app/src/main/assets/index.html", "wb") as hf:
                              hf.write(hdata)
                          html_saved = True
                  except Exception:
                      pass
              if not html_saved:
                  content = html_code if (html_code and html_code != "none") else "<h1>Hello World</h1>"
                  with open("app/src/main/assets/index.html", "w", encoding="utf-8") as hf:
                      hf.write(content)
          else:
              target_domain = urlparse(web_url).netloc.lower()
              if ":" in target_domain:
                  target_domain = target_domain.split(":")[0]
              if target_domain.startswith("www."):
                  target_domain = target_domain[4:]

          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2Apk"
          include ':app'
          ''')

          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write('''plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ''')

          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write(
                  "org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC\n"
                  "org.gradle.parallel=true\n"
                  "org.gradle.caching=true\n"
                  "org.gradle.configureondemand=true\n"
                  "android.useAndroidX=false\n"
              )

          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(f'''plugins {{
              id 'com.android.application'
          }}
          android {{
              namespace "{pkg_name}"
              compileSdk 34
              defaultConfig {{
                  applicationId "{pkg_name}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "{app_ver}"
              }}
              buildTypes {{
                  debug {{
                      minifyEnabled false
                  }}
              }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}
          tasks.withType(JavaCompile) {{
              options.encoding = 'UTF-8'
          }}
          ''')

          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          safe_app_name = escape(app_name).replace("'", "\\'")
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">{safe_app_name}</string>
          </resources>
          ''')

          with open("app/src/main/res/values/colors.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          ''')

          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          with open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w", encoding="utf-8") as f:
              f.write(adaptive_xml)
          with open("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", "w", encoding="utf-8") as f:
              f.write(adaptive_xml)

          safe_url = target_load_url.replace("\\", "\\\\").replace('"', '\\"')
          ban_user_url = f"https://raw.githubusercontent.com/{gh_repo}/main/bans/{chat_id}.txt"
          ban_link_url = f"https://raw.githubusercontent.com/{gh_repo}/main/link_bans/{target_domain}.txt" if target_domain else ""

          java_code = f'''package {pkg_name};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.content.Intent;
          import android.net.Uri;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {{
              private WebView webView;
              private boolean isBanned = false;

              private boolean isRemoteBanned(String checkUrl) {{
                  if (checkUrl == null || checkUrl.isEmpty()) return false;
                  try {{
                      URL url = new URL(checkUrl + "?t=" + System.currentTimeMillis());
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setUseCaches(false);
                      conn.setRequestProperty("Cache-Control", "no-cache");
                      conn.setRequestProperty("Pragma", "no-cache");
                      conn.setConnectTimeout(3000);
                      conn.setReadTimeout(3000);
                      conn.setRequestMethod("GET");
                      int code = conn.getResponseCode();
                      if (code == 200) {{
                          BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) {{
                              sb.append(line);
                          }}
                          br.close();
                          conn.disconnect();
                          return sb.toString().trim().contains("BANNED");
                      }}
                      conn.disconnect();
                      return false;
                  }} catch (Exception e) {{
                      return false;
                  }}
              }}

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {{
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {{
                          if (isBanned) return true;
                          if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("file://")) {{
                              return false;
                          }}
                          try {{
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          }} catch (Exception e) {{}}
                          return true;
                      }}
                  }});

                  String loadingHtml = "<html><body style='background:#0f172a;color:#e2e8f0;font-family:sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;'><div style='font-size:20px;font-weight:bold;'>Loading...</div></body></html>";
                  webView.loadDataWithBaseURL(null, loadingHtml, "text/html", "UTF-8", null);

                  new Thread(new Runnable() {{
                      @Override
                      public void run() {{
                          boolean userBlocked = isRemoteBanned("{ban_user_url}");
                          boolean linkBlocked = isRemoteBanned("{ban_link_url}");

                          if (userBlocked || linkBlocked) {{
                              isBanned = true;
                              runOnUiThread(new Runnable() {{
                                  @Override
                                  public void run() {{
                                      String blockedHtml = "<html><body style='background:#111827;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;text-align:center;margin:0;padding:24px;'><div style='background:#1f2937;border:2px solid #ef4444;border-radius:16px;padding:28px;max-width:340px;'><div style='font-size:60px;margin-bottom:12px;'>&#128683;</div><h2 style='color:#ef4444;margin:0 0 12px 0;'>অ্যাপ / লিংকটি ব্যান করা হয়েছে!</h2><p style='color:#d1d5db;font-size:15px;line-height:1.5;margin:0;'>নিয়ম ভঙ্গ বা সমস্যার কারণে অ্যাডমিন এই লিংক/অ্যাপটি স্থায়ীভাবে বন্ধ (Ban) করেছেন।</p></div></body></html>";
                                      webView.loadDataWithBaseURL(null, blockedHtml, "text/html", "UTF-8", null);
                                  }}
                              }});
                          }} else {{
                              runOnUiThread(new Runnable() {{
                                  @Override
                                  public void run() {{
                                      webView.loadUrl("{safe_url}");
                                  }}
                              }});
                          }}
                      }}
                  }}).start();
              }}

              @Override
              public void onBackPressed() {{
                  if (isBanned) {{
                      finish();
                  }} else if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          '''
          with open(f"app/src/main/java/{pkg_path}/MainActivity.java", "w", encoding="utf-8") as f:
              f.write(java_code)

          class IconParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "link":
                      d = {k.lower(): v for k, v in attrs if v}
                      rel = d.get("rel", "").lower()
                      href = d.get("href", "")
                      if href and ("manifest" in rel or "icon" in rel):
                          self.links.append((rel, href))

          base_img = None
          headers = {"User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36"}

          if icon_id and icon_id not in ["default", "pwa"]:
              try:
                  r = requests.get(f"https://api.telegram.org/bot{bot_token}/getFile?file_id={icon_id}", timeout=10).json()
                  if r.get("ok"):
                      fpath = r["result"]["file_path"]
                      img_data = requests.get(f"https://api.telegram.org/file/bot{bot_token}/{fpath}", timeout=15).content
                      base_img = Image.open(BytesIO(img_data)).convert("RGBA")
              except Exception:
                  pass

          if base_img is None and icon_id == "pwa" and build_mode == "url":
              candidate_urls = []
              try:
                  resp = requests.get(web_url, headers=headers, timeout=8)
                  parser = IconParser()
                  parser.feed(resp.text)
                  for rel, href in parser.links:
                      if "manifest" in rel:
                          man_url = urljoin(web_url, href)
                          try:
                              man_data = requests.get(man_url, headers=headers, timeout=6).json()
                              for ic in man_data.get("icons", []):
                                  if ic.get("src"):
                                      candidate_urls.append(urljoin(man_url, ic["src"]))
                          except Exception:
                              pass
                      else:
                          candidate_urls.append(urljoin(web_url, href))
              except Exception:
                  pass

              domain = urlparse(web_url).netloc
              if domain:
                  candidate_urls.append(f"https://www.google.com/s2/favicons?domain={domain}&sz=256")
                  candidate_urls.append(urljoin(web_url, "/favicon.ico"))

              for i_url in candidate_urls:
                  try:
                      ir = requests.get(i_url, headers=headers, timeout=6)
                      if ir.status_code == 200 and len(ir.content) > 200:
                          test_img = Image.open(BytesIO(ir.content)).convert("RGBA")
                          if test_img.size[0] >= 32:
                              base_img = test_img
                              break
                  except Exception:
                      pass

          if base_img is None:
              base_img = Image.new("RGBA", (512, 512), (37, 99, 235, 255))
              draw = ImageDraw.Draw(base_img)
              draw.ellipse([70, 70, 442, 442], fill=(255, 255, 255, 255))
              draw.ellipse([140, 140, 372, 372], fill=(37, 99, 235, 255))

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, sz in sizes.items():
              resized = base_img.resize((sz, sz), Image.LANCZOS)
              resized.save(f"app/src/main/res/mipmap-{d}/ic_launcher.png", "PNG")
              mask = Image.new("L", (sz, sz), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, sz, sz), fill=255)
              round_img = Image.new("RGBA", (sz, sz), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(f"app/src/main/res/mipmap-{d}/ic_launcher_round.png", "PNG")

          fg_canvas = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          fg_inner = base_img.resize((280, 280), Image.LANCZOS)
          fg_canvas.paste(fg_inner, (76, 76), fg_inner)
          fg_canvas.save("app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png", "PNG")

          if msg_id:
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{bot_token}/editMessageText",
                      json={
                          "chat_id": chat_id,
                          "message_id": int(msg_id),
                          "parse_mode": "HTML",
                          "text": "⏳ <b>APK তৈরি হচ্ছে... 60%</b>\n<code>[██████░░░░]</code>\n\n🔨 <i>APK ফাইল কম্পাইল শুরু হচ্ছে...</i>"
                      },
                      timeout=5
                  )
              except Exception:
                  pass
          PYEOF

      - name: Compile APK with Fast Build Cache
        run: |
          [ -d "$ANDROID_HOME/licenses" ] || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          gradle assembleDebug --build-cache --parallel --no-daemon

      - name: Update Progress 100% & Send APK
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MSG_ID: ${{ inputs.progress_msg_id }}
          APP_NAME: ${{ inputs.app_name }}
          APP_VER: ${{ inputs.app_version }}
          PKG_NAME: ${{ inputs.package_name }}
          BUILD_MODE: ${{ inputs.build_mode }}
          WEB_URL: ${{ inputs.web_url }}
        run: |
          if [ -n "$MSG_ID" ]; then
            DONE_TXT="✅ <b>APK তৈরি সম্পন্ন! 100%</b>%0A<code>[██████████]</code>%0A%0A🚀 <i>আপনার .apk ফাইলটি নিচে পাঠানো হয়েছে!</i>"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}" -d "parse_mode=HTML" -d "text=${DONE_TXT}" >/dev/null || true
          fi

          SAFE_FILE=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-')
          if [ -z "$SAFE_FILE" ]; then SAFE_FILE="WebApp"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "${SAFE_FILE}_v${APP_VER}.apk"

          if [ "$BUILD_MODE" = "html" ]; then
            CAP_LINE="🌐 <b>ধরন:</b> HTML Offline App"
          else
            CAP_LINE="🌐 <b>ওয়েবসাইট:</b> ${WEB_URL}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${SAFE_FILE}_v${APP_VER}.apk" \
            -F caption="🎉 <b>আপনার Android APK সফলভাবে তৈরি হয়েছে!</b>%0A%0A📱 <b>অ্যাপের নাম:</b> ${APP_NAME}%0A📦 <b>প্যাকেজ নেম:</b> <code>${PKG_NAME}</code>%0A🏷️ <b>ভার্সন:</b> v${APP_VER}%0A${CAP_LINE}%0A%0A👇 ফাইলটি ডাউনলোড করে মোবাইলে ইনস্টল করুন!" \
            -F parse_mode="HTML"

      - name: Notify Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MSG_ID: ${{ inputs.progress_msg_id }}
        run: |
          FAIL_TXT="❌ <b>APK তৈরি ব্যর্থ হয়েছে!</b>%0A%0Aসার্ভারে সমস্যা হয়েছে বা প্যাকেজ নেম/কোডে ভুল রয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।"
          if [ -n "$MSG_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}" -d "parse_mode=HTML" -d "text=${FAIL_TXT}" >/dev/null || true
          else
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -d "chat_id=${CHAT_ID}" -d "parse_mode=HTML" -d "text=${FAIL_TXT}" >/dev/null || true
          fi
